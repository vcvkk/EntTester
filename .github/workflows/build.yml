name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project EntTester.xcodeproj \
            -scheme EntTester \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/EntTester.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned .ipa
        run: |
          APP=$(find build/EntTester.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          rm -rf Payload EntTester-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry EntTester-unsigned.ipa Payload
          ls -la EntTester-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EntTester-unsigned-ipa
          path: EntTester-unsigned.ipa
          if-no-files-found: error
