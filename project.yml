name: EntTester
options:
  bundleIdPrefix: app.topaz5224
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  EntTester:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.topaz5224.elephant1433
        CODE_SIGN_STYLE: Manual
    entitlements:
      path: Sources/App/EntTester.entitlements
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: EntTester
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification, fetch]
        NSHealthShareUsageDescription: "Probe HealthKit authorization and read/write a sample."
        NSHealthUpdateUsageDescription: "Probe HealthKit write access."
        NSLocationWhenInUseUsageDescription: "Probe Wi-Fi SSID access (requires location)."
        NSSiriUsageDescription: "Probe SiriKit authorization."
        NFCReaderUsageDescription: "Probe NFC reader availability."
        NSHomeKitUsageDescription: "Probe HomeKit access."
        NSCameraUsageDescription: "Probe multitasking camera support."
        NSBluetoothAlwaysUsageDescription: "Probe MFi accessory configuration."
        NSFaceIDUsageDescription: "Probe authentication services."
        NSUserTrackingUsageDescription: "Not used."
